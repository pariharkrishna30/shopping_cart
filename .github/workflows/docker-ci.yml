name: Ecom CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set auto version (commit SHA)
      - name: Set version
        run: echo "VERSION=${{ github.sha }}" >> $GITHUB_ENV

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Backend Image (Laravel API)
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecom-backend:$VERSION ./api

      # 5. Build Frontend Image (React)
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:$VERSION ./web

      # 6. Push Backend Image (versioned)
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecom-backend:$VERSION

      # 7. Push Frontend Image (versioned)
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:$VERSION

      # 8. Tag and push backend as latest
      - name: Tag backend as latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ecom-backend:$VERSION \
                     ${{ secrets.DOCKERHUB_USERNAME }}/ecom-backend:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecom-backend:latest

      # 9. Tag and push frontend as latest
      - name: Tag frontend as latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:$VERSION \
                     ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:latest